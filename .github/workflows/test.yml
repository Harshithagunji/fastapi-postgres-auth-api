
name: FastAPI Automated Tests

on: [push, pull_request]

jobs:
  test:
   runs-on: ubuntu-latest

   services:
    postgres:
     image: postgres:15
     env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb

     ports:
       - 5432:5432
     options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

   steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
       python-version: '3.11'

    - name: Install dependencies
      run: |
       python -m pip install --upgrade pip
       pip install pytest
       pip install httpx2
       pip install -r requirements.txt 
       

    - name: Run pytest
      env:
        SQLALCHEMY_DATABASE_URL: postgresql://postgres:123456@127.0.0.1:5432/testdb
      run: |
       python -m pytest